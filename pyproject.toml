[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evidence-lab"
version = "0.2.0"
description = "Offline evidence inspection and regression checks for RAG answers"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rag-evidence = "rag_evidence_lab.cli:main"

[tool.setuptools.packages.find]
include = ["rag_evidence_lab*"]
